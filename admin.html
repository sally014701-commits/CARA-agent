<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CARA Benchmark</title>
<style>
:root{
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --soft:#f7f8fa;
  --canvas:#fff;
  --primary:#2563eb;
  --primary-soft:#eff6ff;
  --good:#15803d;
  --random:#b45309;
  --popular:#7c3aed;
  --low:#16a34a;
  --mid:#eab308;
  --high:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--soft);
  color:var(--ink);
  font-family:Inter,"SF Pro Display",system-ui,-apple-system,sans-serif;
}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
}
.nav,.page{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px}
.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{margin:0;font-size:20px;font-weight:700}
.badge{
  border:1px solid #bbf7d0;
  border-radius:999px;
  background:#f0fdf4;
  color:var(--good);
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
}
.page{padding-top:28px;padding-bottom:48px}
.section{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--canvas);
  padding:20px;
}
.section + .section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-title{margin:0;font-size:17px;font-weight:700}
.section-note{color:var(--muted);font-size:12px}
.section-actions{display:flex;align-items:center;gap:10px}
.download{
  border:1px solid #bfdbfe;
  border-radius:6px;
  background:#fff;
  color:#1d4ed8;
  padding:7px 10px;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}
.download:hover{background:#eff6ff}
table{width:100%;border-collapse:collapse;border:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:12px 14px;text-align:right;font-size:14px}
th:first-child,td:first-child{text-align:left}
th{background:#f9fafb;color:var(--muted);font-size:12px;font-weight:700}
tbody tr:last-child td{border-bottom:0}
.cara{color:var(--primary);font-weight:750}
.random{color:var(--random);font-weight:700}
.popular{color:var(--popular);font-weight:700}
.support-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}
.persona-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.persona-item{background:#fff;padding:12px}
.persona-item span{display:block;color:var(--muted);font-size:12px}
.persona-item strong{display:block;margin-top:5px;font-size:18px}
.critic{border-left:3px solid var(--primary);background:var(--primary-soft);padding:14px}
.critic strong{display:block;font-size:26px}
.critic span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
.brain-list{display:grid;gap:13px}
.brain-row{display:grid;grid-template-columns:145px 48px 58px minmax(100px,1fr);gap:12px;align-items:center;font-size:13px}
.brain-label{font-weight:700}
.brain-count,.brain-percent{text-align:right;color:var(--muted)}
.track{height:10px;overflow:hidden;border-radius:999px;background:#eef1f4}
.bar{height:100%;border-radius:999px;transition:width .35s ease}
.bar.low{background:var(--low)}.bar.mid{background:var(--mid)}.bar.high{background:var(--high)}
.empty{border:1px dashed var(--line);color:var(--muted);padding:16px;text-align:center;font-size:13px}
.error{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
@media(max-width:720px){
  .support-grid{grid-template-columns:1fr}
  .persona-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brain-row{grid-template-columns:120px 42px 52px minmax(70px,1fr);gap:8px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <div class="brand">
      <a href="/CARA.html" class="back">&larr; 메인으로</a>
      <h1 id="title">CARA Benchmark</h1>
    </div>
    <span class="badge">CSV 기반 평가</span>
  </div>
</header>

<main class="page">
  <section class="section">
    <div class="section-head">
      <h2 class="section-title">핵심 지표</h2>
      <div class="section-actions">
        <span class="section-note">CARA · Random · Popular 비교</span>
        <a class="download" href="/admin/benchmark/download/metrics" download>CSV 다운로드</a>
      </div>
    </div>
    <div id="metrics"><div class="empty">벤치마크 데이터를 불러오는 중입니다.</div></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">보조 지표</h2>
      <span class="section-note">CARA 전용</span>
    </div>
    <div class="support-grid">
      <div>
        <div class="section-head" style="margin-bottom:10px">
          <div class="section-note">유형별 Persona Satisfaction (1~5점)</div>
          <a class="download" href="/admin/benchmark/download/persona-satisfaction" download>CSV 다운로드</a>
        </div>
        <div id="personas"><div class="empty">Persona 점수 파일을 확인하고 있습니다.</div></div>
      </div>
      <div class="critic">
        <strong id="criticAverage">-</strong>
        <span>Critic 평균 반복 횟수<br />낮을수록 초기 추천 품질이 높습니다.</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">BrainFry 분포</h2>
      <div class="section-actions">
        <span class="section-note">consumer_profiles 기반</span>
        <a class="download" href="/admin/benchmark/download/consumer-profiles" download>CSV 다운로드</a>
      </div>
    </div>
    <div class="brain-list" id="brainfry"><div class="empty">프로필 데이터를 불러오는 중입니다.</div></div>
  </section>
</main>

<script>
const personaOrder = ['Maximizer','ValueSeeker','LossAverse','Impulsive','Hedonic','Utilitarian'];
function pct(value){ return `${(Number(value || 0) * 100).toFixed(1)}%`; }
function metricRow(label, values, format){
  return `<tr><td>${label}</td><td class="cara">${format(values.cara)}</td><td class="random">${format(values.random)}</td><td class="popular">${format(values.popular)}</td></tr>`;
}
function renderMetrics(data){
  const metrics = data.metrics;
  document.getElementById('metrics').innerHTML = `
    <table>
      <thead><tr><th>지표</th><th>CARA</th><th>Random</th><th>Popular</th></tr></thead>
      <tbody>
        ${metricRow('Hit@N', metrics.hit_at_n, pct)}
        ${metricRow('예산 준수율', metrics.budget_compliance, pct)}
        ${metricRow('선호 일치율', metrics.preference_alignment, value => Number(value || 0).toFixed(2))}
      </tbody>
    </table>`;
}
function renderPersonas(data){
  const root = document.getElementById('personas');
  if(!data.sources.persona_scores){
    root.innerHTML = '<div class="empty">persona_scores.csv가 없어 Critic 반복 횟수만 표시합니다.</div>';
    return;
  }
  root.innerHTML = `<div class="persona-list">${personaOrder.map(type => `
    <div class="persona-item"><span>${type}</span><strong>${Number(data.persona_satisfaction[type] || 0).toFixed(1)} / 5</strong></div>
  `).join('')}</div>`;
}
function renderBrainfry(data){
  const labels = [
    ['low','LOW (B≤0.35)'],
    ['mid','MID (0.35&lt;B≤0.65)'],
    ['high','HIGH (B&gt;0.65)']
  ];
  document.getElementById('brainfry').innerHTML = labels.map(([key,label]) => {
    const item = data.brainfry[key];
    return `<div class="brain-row">
      <div class="brain-label">${label}</div>
      <div class="brain-count">${item.count}명</div>
      <div class="brain-percent">${Number(item.percentage).toFixed(1)}%</div>
      <div class="track"><div class="bar ${key}" style="width:${item.percentage}%"></div></div>
    </div>`;
  }).join('');
}
async function loadDashboard(){
  try{
    const response = await fetch('/admin/benchmark/dashboard', { cache:'no-store' });
    if(!response.ok) throw new Error('dashboard request failed');
    const data = await response.json();
    document.getElementById('title').textContent = `CARA Benchmark (n=${data.n_consumers})`;
    document.getElementById('criticAverage').textContent = data.critic_average_iterations === null
      ? '데이터 없음'
      : `${Number(data.critic_average_iterations).toFixed(1)}회`;
    renderMetrics(data);
    renderPersonas(data);
    renderBrainfry(data);
  }catch(error){
    console.error(error);
    document.getElementById('metrics').innerHTML = '<div class="empty error">대시보드 데이터를 불러오지 못했습니다.</div>';
  }
}
loadDashboard();
</script>
</body>
</html>
