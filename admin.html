<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CARA Benchmark</title>
<style>
:root{
  --ink:#0d253d;
  --muted:#64748b;
  --line:#e3e8ee;
  --soft:#f6f9fc;
  --primary:#533afd;
  --primary-dark:#2e2b8c;
  --good:#15803d;
  --canvas:#fff;
  --shadow:0 8px 24px rgba(0,55,112,.08),0 2px 6px rgba(0,55,112,.04);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--soft);
  color:var(--ink);
  font-family:Inter,"SF Pro Display",system-ui,-apple-system,sans-serif;
}
button,input,select{font:inherit}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);
}
.nav{
  max-width:1180px;
  margin:0 auto;
  min-height:66px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px}
.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{margin:0;font-size:20px;font-weight:650}
.badge{
  border:1px solid #bbf7d0;
  border-radius:999px;
  background:#f0fdf4;
  color:var(--good);
  padding:7px 10px;
  font-size:12px;
  font-weight:650;
}
.page{max-width:1180px;margin:0 auto;padding:28px 24px 48px}
.metric-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--canvas);
  padding:14px;
  box-shadow:var(--shadow);
}
.metric strong{display:block;font-size:24px}
.metric span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.panel{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--canvas);
  box-shadow:var(--shadow);
  padding:18px;
}
.panel + .panel{margin-top:18px}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
  margin-bottom:16px;
}
.panel-title{margin:0;font-size:18px;font-weight:650}
.form-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}
label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:650}
input,select{
  width:100%;
  border:1px solid #a8c3de;
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:10px;
  outline:none;
}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(83,58,253,.12)}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px}
.button{
  border:1px solid transparent;
  border-radius:999px;
  background:var(--primary);
  color:#fff;
  padding:10px 16px;
  cursor:pointer;
  font-weight:650;
}
.button:hover{background:var(--primary-dark)}
.button:disabled{opacity:.6;cursor:not-allowed}
.button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.result-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}
.rec-list{display:grid;gap:10px}
.rec{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  padding:12px;
}
.rec strong{display:block;font-size:14px}
.rec span{display:block;margin-top:5px;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:#fff}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:13px;vertical-align:top}
th{background:#f8fafc;color:var(--muted);font-size:12px}
.score{text-align:center;white-space:nowrap;font-weight:650}
.summary{
  margin-top:12px;
  border:1px solid #bfdbfe;
  border-radius:8px;
  background:#eff6ff;
  color:#1d4ed8;
  padding:12px;
  font-weight:650;
}
.empty{
  border:1px dashed var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--muted);
  padding:18px;
  text-align:center;
  font-size:14px;
}
@media (max-width:900px){
  .result-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .form-grid,.metric-strip{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <div class="brand">
      <a href="/app" class="back">&larr; 메인으로</a>
      <h1>CARA Benchmark</h1>
    </div>
    <span class="badge">벤치마크 확인 전용</span>
  </div>
</header>

<main class="page">
  <section class="panel">
    <div class="panel-head">
      <h3 class="panel-title">벤치마크 실행</h3>
      <button class="button ghost" id="presetBtn">화장품 예시 입력</button>
    </div>
    <div class="form-grid">
      <label>소비자 ID
        <input id="benchConsumer" value="C0001" />
      </label>
      <label>검색어
        <input id="benchQuery" value="스킨" />
      </label>
      <label>예산
        <input id="benchBudget" type="number" value="30000" />
      </label>
      <label>스타일
        <select id="benchStyle">
          <option value="utilitarian">utilitarian</option>
          <option value="hedonic">hedonic</option>
        </select>
      </label>
      <label>페르소나
        <select id="benchPersona">
          <option value="utilitarian">utilitarian</option>
          <option value="maximizer">maximizer</option>
          <option value="value_seeker">value_seeker</option>
          <option value="loss_averse">loss_averse</option>
          <option value="impulsive">impulsive</option>
          <option value="hedonic">hedonic</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button class="button" id="runBtn">벤치마크 실행</button>
      <span id="statusText" style="color:var(--muted);font-size:13px">대기 중</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h3 class="panel-title">결과</h3>
      <span id="presentationHint" style="color:var(--muted);font-size:13px"></span>
    </div>
    <div class="metric-strip" style="margin-bottom:16px">
      <div class="metric"><strong id="meanSatisfaction">-</strong><span>평균 만족도</span></div>
      <div class="metric"><strong id="meanEase">-</strong><span>평균 결정 용이성</span></div>
    </div>
    <div class="result-grid">
      <div>
        <h4 style="margin:0 0 10px">추천 결과</h4>
        <div class="rec-list" id="recommendations"><div class="empty">아직 실행된 벤치마크가 없습니다.</div></div>
      </div>
      <div>
        <h4 style="margin:0 0 10px">페르소나 평가</h4>
        <div id="evaluation"><div class="empty">실행 후 평가 점수가 표시됩니다.</div></div>
      </div>
    </div>
  </section>
</main>

<script>
function $(id){ return document.getElementById(id); }
function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function money(value){ return '₩' + Math.round(Number(value || 0)).toLocaleString('ko-KR'); }

function usePreset(){
  $('benchConsumer').value = 'C0001';
  $('benchQuery').value = '스킨';
  $('benchBudget').value = '30000';
  $('benchStyle').value = 'utilitarian';
  $('benchPersona').value = 'maximizer';
}

async function runBenchmark(){
  const btn = $('runBtn');
  btn.disabled = true;
  btn.textContent = '실행 중...';
  $('statusText').textContent = 'Planner, Executor, Critic, Persona Evaluator 실행 중';

  const payload = {
    consumer_id:$('benchConsumer').value.trim() || 'C0001',
    query:$('benchQuery').value.trim() || '스킨',
    budget_ceiling:Number($('benchBudget').value || 30000),
    preferred_style:$('benchStyle').value,
    psychographic_type:$('benchPersona').value
  };

  try{
    const response = await fetch('/admin/benchmark/evaluate', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify(payload)
    });
    if(!response.ok) throw new Error('benchmark failed');
    const data = await response.json();
    renderBenchmark(data);
    $('statusText').textContent = '완료';
  } catch(error){
    console.error(error);
    $('statusText').textContent = '실패: 서버 로그를 확인하세요';
  } finally{
    btn.disabled = false;
    btn.textContent = '벤치마크 실행';
  }
}

function renderBenchmark(data){
  $('meanSatisfaction').textContent = `${Number(data.mean_satisfaction || 0).toFixed(2)} / 5`;
  $('meanEase').textContent = `${Number(data.mean_decision_ease || 0).toFixed(2)} / 5`;
  $('presentationHint').textContent = data.presentation_hint || '';

  $('recommendations').innerHTML = (data.recommendations || []).map(product => `
    <article class="rec">
      <strong>${escapeHtml(product.name)}</strong>
      <span>${escapeHtml(product.category || product.subcategory || '-')} · ${money(product.price)} · Rating ${Number(product.rating || product.star_rating || 0).toFixed(1)}</span>
      <span>RAG ${product.RAG_score !== undefined && product.RAG_score !== null ? Number(product.RAG_score).toFixed(2) : '-'}</span>
    </article>`).join('') || '<div class="empty">추천 결과가 없습니다.</div>';

  const rows = Object.entries(data.persona_evaluation || {}).map(([persona, scores]) => `
    <tr>
      <td><strong>${escapeHtml(persona)}</strong></td>
      <td class="score">${escapeHtml(scores.persona_satisfaction_score)} / 5</td>
      <td class="score">${escapeHtml(scores.decision_ease_score)} / 5</td>
      <td>${escapeHtml(scores.reasoning)}</td>
    </tr>`).join('');

  $('evaluation').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>페르소나</th>
          <th>만족도</th>
          <th>결정 용이성</th>
          <th>AI 평가</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="summary">전체 평균 만족도 ${Number(data.mean_satisfaction || 0).toFixed(2)} / 5 · 결정 용이성 ${Number(data.mean_decision_ease || 0).toFixed(2)} / 5</div>`;
}

$('presetBtn').onclick = usePreset;
$('runBtn').onclick = runBenchmark;
</script>
</body>
</html>
